name: workshop-eks-cluster
description: >-
  Simulated for the operator workshop. Provisions no real cloud resources.
  A Kubernetes cluster in the shape of EKS. Lives in the `kubernetes` project,
  needs the VPC from the `network` project, and is shared with the `api`
  project as an environment default.
source_url: https://github.com/massdriver-workshops/onsite-operator-workshop-092026/tree/main/bundles/workshop-eks-cluster
version: 0.1.0

steps:
  - path: src
    provisioner: opentofu

params:
  examples:
    - __name: Development
      kubernetes_version: "1.31"
      node_count: 2
      node_size: t3.medium
    - __name: Production
      kubernetes_version: "1.31"
      node_count: 3
      node_size: m6i.large
  required:
    - kubernetes_version
    - node_count
    - node_size
  properties:
    kubernetes_version:
      title: Kubernetes Version
      description: Control plane version. Upgrades are one minor version at a time.
      type: string
      default: "1.31"
      enum:
        - "1.30"
        - "1.31"
        - "1.32"
    node_count:
      title: Node Count
      description: Worker nodes in the default node group.
      type: integer
      default: 2
      minimum: 1
      maximum: 10
    node_size:
      title: Node Size
      description: Instance type for every worker node.
      type: string
      default: t3.medium
      oneOf:
        - const: t3.medium
          title: "t3.medium: 2 vCPU, 4 GiB, dev and test"
        - const: m6i.large
          title: "m6i.large: 2 vCPU, 8 GiB, small production"
        - const: m6i.xlarge
          title: "m6i.xlarge: 4 vCPU, 16 GiB, production"

dependencies:
  aws_authentication:
    resource_type: workshop-aws-authentication@~0
    required: true
  vpc:
    resource_type: workshop-vpc@~0
    required: true

resources:
  cluster:
    resource_type: workshop-kubernetes-cluster@0.1.0
    required: true

ui:
  ui:order:
    - kubernetes_version
    - node_size
    - node_count
    - "*"
  node_count:
    ui:widget: updown
