name: workshop-s3-asset-bucket
description: >-
  Simulated for the operator workshop. Provisions no real cloud resources.
  An object-storage bucket for application assets. Emits the generic
  workshop-s3-bucket resource type.
source_url: https://github.com/massdriver-workshops/onsite-operator-workshop-092026/tree/main/bundles/workshop-s3-asset-bucket
# Every publish needs a new version. Stable versions are immutable.
# STEP 10.6: 0.1.1 after the first fix, 0.1.2 after the second.
# STEP 11:   0.2.0 with the form improvements below.
# ADVANCED B: 0.3.0 with the second step.
version: 0.1.0

steps:
  - path: src
    provisioner: opentofu
    # ADVANCED B2: a step's `config` is jq over params and dependencies. This one
    # runs the compliance scan everywhere and fails the deploy only in production.
    # config:
    #   checkov:
    #     enable: true
    #     halt_on_failure: '.params.md_metadata.default_tags["md-environment"] == "production"'
  # ADVANCED B1: a second step. Same params and dependencies, its own container.
  # skip_on_delete leaves its state in place when the bundle is decommissioned.
  # The Terraform is already in retention/main.tf.
  # - path: retention
  #   provisioner: opentofu
  #   skip_on_delete: true
  # ADVANCED C1: a custom provisioner as a third step. Source in
  # provisioners/provisioner-echo/. The audit/ directory already exists.
  # - path: audit
  #   provisioner: massdrivercloud/provisioner-echo:0.1.0
  #   config:
  #     system: '@text "cmdb"'
  #     region: .dependencies.aws_authentication.specs.aws.region
  #     owner: .params.md_metadata.name_prefix

# The form a developer sees today: three untitled, unconstrained fields.
# STEP 11 turns it into a product. Every line marked STEP 11 below is the
# improvement, commented out. Remove the leading `# ` and nothing else.
params:
  # STEP 11: presets. A developer starts from one of these instead of an empty
  # form. `__name` is the label in the preset dropdown.
  # examples:
  #   - __name: Development
  #     bucket_name: dev-assets
  #     versioning_enabled: false
  #     retention_days: 7
  #     storage_class: standard
  #   - __name: Production
  #     bucket_name: prod-assets
  #     versioning_enabled: true
  #     retention_days: 365
  #     storage_class: standard_ia
  required:
    - bucket_name
    - versioning_enabled
    - retention_days
  properties:
    bucket_name:
      type: string
      # STEP 11: label, help text, and limits. Enforced in the form AND at the API.
      # title: Bucket Name
      # description: Base name for the bucket. A unique suffix is appended automatically, so this does not need to be globally unique.
      # minLength: 3
      # maxLength: 40
      # pattern: ^[a-z0-9][a-z0-9-]*[a-z0-9]$
      # message:
      #   pattern: "Lowercase letters, digits, and hyphens. Must start and end with a letter or digit."
      # $md.immutable: true
    versioning_enabled:
      type: boolean
      # STEP 11
      # title: Versioning
      # description: Keep previous versions of overwritten and deleted objects.
      # default: true
    retention_days:
      type: integer
      # STEP 11: nobody can deploy -5 days, no matter how they submit.
      # title: Retention (days)
      # description: Objects older than this are expired by a lifecycle rule.
      # default: 30
      # minimum: 1
      # maximum: 3650
      # message:
      #   minimum: "Retention must be at least 1 day."
      #   maximum: "Retention cannot exceed 10 years (3650 days)."
    # STEP 11: a brand-new param. It has a default and is NOT in `required`, so
    # every instance configured before it existed keeps validating.
    # storage_class:
    #   title: Storage Class
    #   description: Tier that new objects are written to. Infrequent Access is cheaper to store and more expensive to read.
    #   type: string
    #   default: standard
    #   oneOf:
    #     - const: standard
    #       title: "Standard: frequently accessed data"
    #     - const: standard_ia
    #       title: "Standard-IA: accessed less than once a month"
    #     - const: glacier_ir
    #       title: "Glacier Instant Retrieval: archives that still need millisecond reads"

dependencies:
  aws_authentication:
    resource_type: workshop-aws-authentication@~0
    required: true

resources:
  bucket:
    resource_type: workshop-s3-bucket@0.1.0
    required: true

# STEP 11: the ui block controls order, widgets, placeholders, and help.
ui:
  ui:order:
    # STEP 11: uncomment the four lines below
    # - bucket_name
    # - storage_class
    # - versioning_enabled
    # - retention_days
    - "*"
  # STEP 11: uncomment every line from here to the end of the file
  # bucket_name:
  #   ui:placeholder: my-app-assets
  #   ui:help: "Cannot be changed after the first deploy."
  # storage_class:
  #   ui:help: "Not sure? Standard is the right answer for almost everything."
  # retention_days:
  #   ui:widget: updown
  #   ui:help: "Set to 3650 to effectively keep everything."
