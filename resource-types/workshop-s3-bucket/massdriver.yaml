# Simulated for the operator workshop. Provisions no real cloud resources.
#
# This resource type is in the repo but NOT published by seed.sh. You publish it
# yourself in step 10.
#
# Produced by the workshop-s3-asset-bucket bundle (and by any other bucket bundle an
# operator writes later: logs bucket, data-lake bucket, CDN origin bucket). The type
# describes WHAT a bucket is; bundles decide HOW one is provisioned. The name is
# `s3-bucket`, not `s3-asset-bucket`: many bundles, one type.
name: workshop-s3-bucket
version: 0.1.0
label: "Workshop: Object Storage Bucket (simulated)"

ui:
  connectionOrientation: link

schema:
  title: "Workshop: Object Storage Bucket (simulated)"
  description: >-
    Simulated for the operator workshop. Provisions no real cloud resources.
    A bucket identifier and endpoint in the shape of a real S3 bucket.
  type: object
  # additionalProperties: false is what makes this a contract. A producer that
  # emits a field not listed here fails validation at deploy time.
  additionalProperties: false
  required:
    - infrastructure
    - endpoint
    - specs
  properties:
    # infrastructure and endpoint are what a consumer NEEDS to use the bucket.
    infrastructure:
      title: Infrastructure
      type: object
      additionalProperties: false
      required:
        - arn
        - name
      properties:
        arn:
          title: Bucket ARN
          type: string
          pattern: ^arn:aws:s3:::.+$
          message:
            pattern: "Must look like arn:aws:s3:::<bucket-name>"
        name:
          title: Bucket Name
          type: string
    endpoint:
      title: Endpoint
      type: object
      additionalProperties: false
      required:
        - url
      properties:
        url:
          title: URL
          description: Virtual-hosted style URL for the bucket.
          type: string
    # specs is what a consumer might want to KNOW. Nothing here is needed to
    # use the bucket. Not in it, on purpose: retention_days and storage_class.
    # Those are params. A consumer has no business knowing the bucket's
    # retention policy.
    specs:
      title: Specs
      type: object
      additionalProperties: false
      required:
        - aws
      properties:
        aws:
          title: AWS
          type: object
          additionalProperties: false
          required:
            - region
          properties:
            region:
              title: Region
              type: string
        versioning_enabled:
          title: Versioning Enabled
          type: boolean
